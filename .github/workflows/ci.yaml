name: CI

on:
  pull_request:
  # releaser pushes this branch before the release PR exists, so its first
  # commit only gets a push run.
  push:
    branches: [releaser/release]
  workflow_call:
    secrets:
      docker_hub_token:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Paris
  REGISTRY_IMAGE: orochibraru/baba
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  prek:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Full suite with coverage, including the built binary's runs; fails under 70%.
      - run: .github/scripts/coverage.sh

  # ===========================================
  # Docker: Build — only when Docker files change
  # ===========================================
  docker:
    name: Docker
    uses: ./.github/workflows/docker.yaml
    with:
      publish: true
      image-name: orochibraru/baba
    secrets:
      docker_hub_token: ${{ secrets.DOCKER_HUB_TOKEN }}

  # ===========================================
  # Gate — always runs; set this as the single
  # required status check in branch protection
  # ===========================================
  gate:
    name: CI Gate
    if: always()
    needs: [prek, test, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.prek.result }}" "${{ needs.test.result }}" "${{ needs.docker.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All checks passed (skipped jobs are OK)"
