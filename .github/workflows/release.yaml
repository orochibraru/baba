name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every push to main ships a canary (`vX.Y.Z-canary.N`, a GitHub prerelease).
# releaser keeps a `chore(release): X.Y.Z` PR open; merging it cuts the stable
# release. The tags it pushes trigger Publish, which builds the Docker image.
jobs:
  check:
    uses: ./.github/workflows/ci.yaml
    secrets:
      docker_hub_token: ${{ secrets.DOCKER_HUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pushes over a deploy key trigger workflows, unlike github.token: Publish
      # on the tags, CI on the release PR. It needs write access and a bypass on
      # any tag and branch rulesets.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The binaries embed package.json's version, which releaser leaves alone
      # on canaries.
      - name: Tag, release and update the release PR
        uses: orochibraru/releaser@v1
        with:
          branch: main
          rules: breaking=major,feat=patch,docs=patch,refactor=patch,style=patch,test=patch,build=patch,ci=patch,chore=patch
          prerelease: canary
          release-pr: "true"
          prepare: npm pkg set version=${version} && bun run build
          artifacts: |
            dist/bun-linux-x64.gz=baba-linux-x64.gz
            dist/bun-linux-arm64.gz=baba-linux-arm64.gz
            dist/bun-darwin-x64.gz=baba-darwin-x64.gz
            dist/bun-darwin-arm64.gz=baba-darwin-arm64.gz
            dist/bun-windows-x64.exe.gz=baba-windows-x64.exe.gz
            dist/bun-windows-arm64.exe.gz=baba-windows-arm64.exe.gz
            dist/bun-linux-x64=baba-linux-x64
            dist/bun-linux-arm64=baba-linux-arm64
            dist/bun-darwin-x64=baba-darwin-x64
            dist/bun-darwin-arm64=baba-darwin-arm64
            dist/bun-windows-x64.exe=baba-windows-x64.exe
            dist/bun-windows-arm64.exe=baba-windows-arm64.exe
            scripts/install.sh=install.sh
            config.example.json=config.example.json

      # Releases only: the canary tags stay, releaser numbers from them.
      - name: Keep only the last five canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes
