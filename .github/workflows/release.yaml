name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every push to main ships a canary (`vX.Y.Z-canary.N`, a GitHub prerelease).
# releaser keeps a `chore(release): X.Y.Z` PR open; merging it cuts the stable
# release. The tags it pushes trigger Publish, which builds the Docker image.
jobs:
  check:
    uses: ./.github/workflows/ci.yaml
    secrets:
      docker_hub_token: ${{ secrets.DOCKER_HUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pushes over a deploy key trigger workflows, unlike github.token: Publish
      # on the tags, CI on the release PR. It needs write access and a bypass on
      # any tag and branch rulesets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The binaries embed the version through -ldflags, canaries included.
      - name: Tag, release and update the release PR
        uses: orochibraru/releaser@8eee44bb688e8600535d5ca454223a1a9f468491 # v1.7.0
        with:
          branch: main
          rules: breaking=major,feat=patch,docs=patch,refactor=patch,style=patch,test=patch,build=patch,ci=patch,chore=patch
          prerelease: canary
          release-pr: "true"
          prepare: scripts/build.sh ${version}
          artifacts: |
            dist/*
            scripts/install.sh=install.sh
            config.example.json=config.example.json

      # Releases only: the canary tags stay, releaser numbers from them.
      - name: Keep only the last five canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes
